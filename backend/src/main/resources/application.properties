server.port=${PORT:8080}
server.servlet.context-path=
server.forward-headers-strategy=framework
server.shutdown=graceful

app.db.pool-size=${DB_POOL_SIZE:5}

spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.open-in-view=true

spring.h2.console.enabled=${H2_CONSOLE_ENABLED:false}
spring.h2.console.path=/h2-console

app.jwt.secret=${JWT_SECRET:change-me-local-dev-only-please-set-JWT_SECRET-in-production-0123456789}
app.jwt.expiration-ms=86400000

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174,https://*.netlify.app}

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
