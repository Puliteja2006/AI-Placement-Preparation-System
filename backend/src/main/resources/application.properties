# ===================================================================
# Server
# ===================================================================
server.port=${PORT:8080}
server.servlet.context-path=
server.forward-headers-strategy=framework
server.shutdown=graceful

# ===================================================================
# Database
# Set these on Render (Environment tab):
#   SPRING_DATASOURCE_URL, SPRING_DATASOURCE_USERNAME, SPRING_DATASOURCE_PASSWORD
# Do NOT define spring.datasource.* here. DataSourceConfig.java reads them.
# ===================================================================
app.db.pool-size=${DB_POOL_SIZE:5}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.open-in-view=true

# H2 console: off unless you turn it on locally
spring.h2.console.enabled=${H2_CONSOLE_ENABLED:false}
spring.h2.console.path=/h2-console

# ===================================================================
# Security & JWT
# Set JWT_SECRET on Render to a long random string (32+ characters)
# ===================================================================
app.jwt.secret=${JWT_SECRET:change-me-local-dev-only-please-set-JWT_SECRET-in-production-0123456789}
app.jwt.expiration-ms=86400000

# Frontend addresses allowed to call this backend
# (comma-separated, no spaces, no trailing slash)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174,https://ai-placement-frontend-v6qc.onrender.com,https://*.netlify.app}

# ===================================================================
# File Upload
# ===================================================================
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
